name: APK
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias y generar el proyecto Android
        working-directory: app_fuente
        env:
          CI: "1"
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npx expo prebuild --platform android --no-install
      - name: Permitir HTTP solo a 127.0.0.1 y localhost (el backend corre en el propio telefono)
        working-directory: app_fuente/android/app/src/main
        run: |
          mkdir -p res/xml
          cat > res/xml/network_security_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <domain-config cleartextTrafficPermitted="true">
              <domain includeSubdomains="false">127.0.0.1</domain>
              <domain includeSubdomains="false">localhost</domain>
            </domain-config>
          </network-security-config>
          XML
          grep -q networkSecurityConfig AndroidManifest.xml || sed -i 's|<application |<application android:networkSecurityConfig="@xml/network_security_config" |' AndroidManifest.xml
          grep -q networkSecurityConfig AndroidManifest.xml
      - name: Compilar el APK
        working-directory: app_fuente/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: neurotok-apk
          path: app_fuente/android/app/build/outputs/apk/release/*.apk
